<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Лаб. 3 — сцена из Blender</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      #hint {
        position: fixed; left: 0; right: 0; bottom: 12px; z-index: 10;
        text-align: center; font: 14px/1.4 sans-serif; color: #fff;
        text-shadow: 0 1px 3px #000; pointer-events: none;
      }
      #ui { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; }
      #ui button {
        font: 14px sans-serif; padding: 8px 12px; border: 0; border-radius: 8px;
        background: rgba(0,0,0,.55); color: #fff;
      }
    </style>
    <script>
      // Простой "осмотр модели": перетаскивание пальцем/мышью вращает сцену,
      // щипок двумя пальцами или колесо мыши — приближение.
      AFRAME.registerComponent('touch-orbit', {
        schema: { distance: { default: 16 }, min: { default: 5 }, max: { default: 30 } },
        init: function () {
          this.yaw = 0; this.pitch = 0.35; this.auto = true;
          this.pointers = new Map(); this.pinch = 0;
          const canvas = this.el.sceneEl.canvas || document.body;
          const target = this.el.sceneEl;
          const down = (e) => { this.pointers.set(e.pointerId, e); this.auto = false; };
          const up = (e) => { this.pointers.delete(e.pointerId); this.pinch = 0; };
          const move = (e) => {
            if (!this.pointers.has(e.pointerId)) return;
            const prev = this.pointers.get(e.pointerId);
            this.pointers.set(e.pointerId, e);
            if (this.pointers.size === 1) {
              this.yaw += (e.clientX - prev.clientX) * 0.008;
              this.pitch += (e.clientY - prev.clientY) * 0.006;
              this.pitch = Math.max(-0.1, Math.min(1.3, this.pitch));
            } else if (this.pointers.size === 2) {
              const [a, b] = [...this.pointers.values()];
              const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
              if (this.pinch) this.zoom((this.pinch - d) * 0.05);
              this.pinch = d;
            }
          };
          target.addEventListener('pointerdown', down);
          window.addEventListener('pointerup', up);
          window.addEventListener('pointercancel', up);
          window.addEventListener('pointermove', move);
          target.addEventListener('wheel', (e) => this.zoom(e.deltaY * 0.01), { passive: true });
          document.getElementById('spin').addEventListener('click', () => { this.auto = !this.auto; });
          document.getElementById('reset').addEventListener('click', () => {
            this.yaw = 0; this.pitch = 0.35; this.data.distance = 16;
          });
        },
        zoom: function (dz) {
          this.data.distance = Math.max(this.data.min, Math.min(this.data.max, this.data.distance + dz));
        },
        tick: function (t, dt) {
          if (this.el.sceneEl.is('vr-mode')) return;
          if (this.auto) this.yaw += dt * 0.0002;
          const d = this.data.distance, p = this.pitch;
          // камера движется по сфере вокруг центра сцены (0, 2, 0)
          const x = Math.sin(this.yaw) * Math.cos(p) * d;
          const y = 2 + Math.sin(p) * d;
          const z = Math.cos(this.yaw) * Math.cos(p) * d;
          this.el.object3D.position.set(x, y, z);
          // Object3D.lookAt направляет ось +Z на цель, а камера смотрит вдоль -Z,
          // поэтому "смотрим" в точку, симметричную центру сцены
          this.el.object3D.lookAt(2 * x, 2 * y - 2, 2 * z);
        }
      });
    </script>
  </head>
  <body>
    <div id="ui">
      <button id="spin">⟳ Вращение</button>
      <button id="reset">Сброс</button>
    </div>
    <div id="hint">Тяните пальцем — повернуть, щипок — приблизить. Кнопка VR — режим очков.</div>

    <a-scene renderer="antialias: true; colorManagement: true" background="color: #9fd3ff">
      <a-assets>
        <a-asset-item id="scene-model" src="models/scene.glb"></a-asset-item>
      </a-assets>

      <!-- Модель, сделанная в Blender и экспортированная в glTF -->
      <a-entity gltf-model="#scene-model"></a-entity>

      <!-- Добавлено средствами A-Frame: облака-сферы, которые плавают над сценой -->
      <a-entity position="0 8 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
        <a-sphere position="6 0 0" radius="0.9" color="#ffffff" opacity="0.9"></a-sphere>
        <a-sphere position="6.9 0.2 0.3" radius="0.7" color="#ffffff" opacity="0.9"></a-sphere>
        <a-sphere position="-6 0.5 2" radius="1.1" color="#ffffff" opacity="0.9"></a-sphere>
        <a-sphere position="-5 0.3 2.4" radius="0.8" color="#ffffff" opacity="0.9"></a-sphere>
      </a-entity>

      <!-- Свет -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.9" position="5 10 7"></a-entity>
      <a-entity light="type: point; color: #ffd27a; intensity: 0.8; distance: 6" position="1.4 2.3 3.5"></a-entity>

      <a-sky color="#9fd3ff"></a-sky>

      <!-- Камера: на телефоне — осмотр пальцем; в VR-режиме — гироскоп -->
      <a-entity id="cam" camera look-controls="enabled: false" touch-orbit></a-entity>
    </a-scene>
  </body>
</html>
