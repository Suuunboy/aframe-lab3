<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Лаб. 3 — сцена из Blender</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
      #hint {
        position: fixed; left: 0; right: 0; bottom: 12px; z-index: 10;
        text-align: center; font: 14px/1.4 sans-serif; color: #fff;
        text-shadow: 0 1px 3px #000; pointer-events: none;
      }
      #ui { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; }
      #ui button {
        font: 14px sans-serif; padding: 8px 12px; border: 0; border-radius: 8px;
        background: rgba(0,0,0,.55); color: #fff;
      }
    </style>
    <script>
      // Управление моделью (камерой управляет look-controls: гироскоп телефона / мышь):
      //  - кнопка «Вращение» включает/выключает поворот модели;
      //  - щипок двумя пальцами или колесо мыши — приблизить/отдалить модель.
      AFRAME.registerComponent('model-controls', {
        schema: { distance: { default: 14 }, min: { default: 5 }, max: { default: 30 } },
        init: function () {
          this.spin = true;
          this.pinch = 0;
          const scene = this.el.sceneEl;
          scene.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 2) return;
            const [a, b] = e.touches;
            const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
            if (this.pinch) this.zoom((this.pinch - d) * 0.05);
            this.pinch = d;
          }, { passive: true });
          scene.addEventListener('touchend', () => { this.pinch = 0; });
          scene.addEventListener('wheel', (e) => this.zoom(e.deltaY * 0.01), { passive: true });
          document.getElementById('spin').addEventListener('click', () => { this.spin = !this.spin; });
          document.getElementById('closer').addEventListener('click', () => this.zoom(-2));
          document.getElementById('farther').addEventListener('click', () => this.zoom(2));
        },
        zoom: function (dz) {
          this.data.distance = Math.max(this.data.min, Math.min(this.data.max, this.data.distance + dz));
        },
        tick: function (t, dt) {
          const o = this.el.object3D;
          if (this.spin) o.rotation.y += dt * 0.0003;
          o.position.z = -this.data.distance;  // модель стоит перед камерой
        }
      });
    </script>
  </head>
  <body>
    <div id="ui">
      <button id="spin">⟳ Вращение</button>
      <button id="closer">＋</button>
      <button id="farther">－</button>
    </div>
    <div id="hint">Поворачивайте телефон, чтобы осмотреться. Щипок — приблизить. Кнопка VR — режим очков.</div>

    <a-scene renderer="antialias: true; colorManagement: true" background="color: #9fd3ff">
      <a-assets>
        <a-asset-item id="scene-model" src="models/scene.glb"></a-asset-item>
      </a-assets>

      <!-- Модель, сделанная в Blender и экспортированная в glTF.
           Стоит перед камерой и чуть ниже уровня глаз -->
      <a-entity model-controls position="0 -3 -14">
        <a-entity gltf-model="#scene-model"></a-entity>

        <!-- Добавлено средствами A-Frame: облака, которые плавают над сценой -->
        <a-entity position="0 8 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
          <a-sphere position="6 0 0" radius="0.9" color="#ffffff" opacity="0.9"></a-sphere>
          <a-sphere position="6.9 0.2 0.3" radius="0.7" color="#ffffff" opacity="0.9"></a-sphere>
          <a-sphere position="-6 0.5 2" radius="1.1" color="#ffffff" opacity="0.9"></a-sphere>
          <a-sphere position="-5 0.3 2.4" radius="0.8" color="#ffffff" opacity="0.9"></a-sphere>
        </a-entity>

        <a-entity light="type: point; color: #ffd27a; intensity: 0.8; distance: 6" position="1.4 2.3 3.5"></a-entity>
      </a-entity>

      <!-- Свет -->
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.9" position="5 10 7"></a-entity>

      <a-sky color="#9fd3ff"></a-sky>

      <!-- Камера как в примере A-Frame: на телефоне поворачивается гироскопом,
           на компьютере — мышью; WASD — перемещение -->
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
