<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame: изменённый пример</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Куб: повёрнут иначе и медленно вращается -->
      <a-box position="-1.5 0.5 -3" rotation="0 20 0" color="#4CC3D9"
             animation="property: rotation; to: 0 380 0; loop: true; dur: 8000; easing: linear"></a-box>

      <!-- Сфера: меньше и ниже -->
      <a-sphere position="0 0.9 -5" radius="0.9" color="#EF2D5E"></a-sphere>

      <!-- Цилиндр: ИЗМЕНЁН размер и положение
           было: position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"
           стало: выше, тоньше, сдвинут вправо и назад, другой цвет -->
      <a-cylinder position="1.6 1.25 -3.5" radius="0.3" height="2.5" color="#FF8C00"></a-cylinder>

      <!-- Новая фигура: конус -->
      <a-cone position="0.3 0.6 -2.5" radius-bottom="0.4" radius-top="0" height="1.2" color="#8A2BE2"></a-cone>

      <!-- Пол: больше -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="6" height="6" color="#7BC8A6"></a-plane>

      <a-sky color="#DDEEFF"></a-sky>
    </a-scene>
  </body>
</html>
